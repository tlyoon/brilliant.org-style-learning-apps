# Repository-tracked shared generator configuration.
# Keep credentials, tokens, Chrome profiles, source PDFs, and run data outside Git.

[placeholders]
sourcepath = "https://drive.google.com/open?id=1BqdcGJR3usQvItCNMC997fkcXaScNYqc&usp=drive_fs"
gemini-gem = "https://gemini.google.com/gem/1dZR01a7xJ9pveqo55MwzfuPV2i_tUQvJ?usp=sharing"
loginname = "tlyoon@gmail.com"
pdf_subchapter_path = "8.1"
target_filename = "source.pdf"
target_file = "{sourcepath}/**/{pdf_subchapter_path}/{target_filename}"

[gemini]
gem_edit_url = ""
gem_name = "app content generator"
browser_mode = "controlled"

[google_drive]
drive_api_timeout_seconds = 60
max_drive_folders = 10000

[automation]
selection_mode = "specific"
coordinator_url = ""
coordinator_token_env = "BRILLIANT_COORDINATOR_TOKEN"
coordinator_timeout_seconds = 30
lease_seconds = 3600
heartbeat_seconds = 300
max_job_attempts = 3

[repository]
repo_root = "${REPO_ROOT}"

[run]
package_id = "chapter-8-section-8-1"
chapter = "Replace with chapter title"
subchapter = "8.1 Replace with subchapter title"
chapter_dir = "chapter-8"
section_dir = "section-8-1"
learning_boundary = "Describe exactly what is included and excluded."
source_id = "serway-section-8-1"
edition = "Replace with the controlled edition/version"
heading = "8.1 Replace with the controlled heading"
page_range = "Replace with the controlled page range"
reviewer = "Replace with responsible instructor or content owner"
rights_note = "Instructor-authorized controlled source; use is limited to original transformation and provenance. The PDF and extracted passages must not enter Git."

[limits]
max_repair_attempts = 4
ui_timeout_seconds = 30
login_timeout_seconds = 300
response_timeout_seconds = 600
max_gemini_session_restarts = 2
log_level = "INFO"

[git]
git_publish = false
git_remote = "origin"
git_base_branch = "main"
git_branch_prefix = "automation"
git_create_draft_pr = true
git_run_full_tests = true

[models]
model_preference_patterns = [
  "\\bpro\\b|most capable|highest capability|advanced reasoning",
  "advanced|reasoning|high capability",
  "\\bflash\\b|fast",
]
allow_unknown_model_fallback = true
