name: Validate repository

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint source files
        run: |
          python scripts/lint.py
          node --check app/app.js
      - name: Validate JSON and content rules
        run: |
          python -m json.tool content/schema/content-package.schema.json >/dev/null
          python -m json.tool content/templates/subchapter.template.json >/dev/null
          python -m json.tool content/source-manifests/source-manifest.example.json >/dev/null
          python scripts/validate_content.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Reject course-specific legacy naming
        run: |
          if grep -RniE 'zca[ _-]?101' --exclude-dir=.git .; then
            exit 1
          fi

