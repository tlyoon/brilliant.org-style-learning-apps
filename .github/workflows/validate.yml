name: Validate repository

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Historical release validation and the documentation-impact gate need repository history.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint source files
        run: |
          python scripts/lint.py
          node --check app/app.js
          node tests/test_app_rendering.js
          node tests/test_app_loading.js
      - name: Validate JSON and content rules
        run: |
          python -m json.tool content/schema/content-package.schema.json >/dev/null
          python -m json.tool content/schema/source-manifest.schema.json >/dev/null
          python -m json.tool content/templates/subchapter.template.json >/dev/null
          python -m json.tool content/source-manifests/source-manifest.example.json >/dev/null
          python scripts/validate_content.py
      - name: Enforce operational documentation updates
        run: python scripts/check_documentation_impact.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Reject course-specific legacy naming
        run: |
          if grep -RniE 'zca[ _-]?101' --exclude-dir=.git .; then
            exit 1
          fi
