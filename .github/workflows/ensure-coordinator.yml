name: Ensure managed coordinator

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: Tracked project.project_name to provision/update
        required: true
        type: string
      web_app_url:
        description: Optional administrator-published /exec URL for first-project recovery
        required: false
        default: ""
        type: string

permissions:
  contents: read

# All PCs request the same project-scoped ensure operation. GitHub serializes them,
# so only one privileged Apps Script deployment can run at a time. Repeated queued
# requests are harmless because the deployer is idempotent.
concurrency:
  group: managed-coordinator-${{ inputs.project_name }}
  cancel-in-progress: false

jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install coordinator deployment dependencies
        run: python -m pip install -r requirements-generator.txt
      - name: Provision or upgrade managed coordinator
        env:
          COORDINATOR_ADMIN_TOKEN_JSON: ${{ secrets.COORDINATOR_ADMIN_TOKEN_JSON }}
          MANAGED_PROJECT_NAME: ${{ inputs.project_name }}
          MANAGED_WEB_APP_URL: ${{ inputs.web_app_url }}
        run: >-
          python coordinator/deployment/manage.py ensure
          --repo-root .
          --project-name "$MANAGED_PROJECT_NAME"
          --web-app-url "$MANAGED_WEB_APP_URL"
