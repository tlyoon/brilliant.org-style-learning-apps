name: Ensure managed coordinator

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: Tracked project.project_name to provision/update
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - "coordinator/**"
      - "app_generator/coordinator/protocol.py"
      - ".github/workflows/ensure-coordinator.yml"
      - "config/configure_project.toml"

permissions:
  contents: read

concurrency:
  group: managed-coordinator-${{ inputs.project_name || github.repository }}
  cancel-in-progress: false

jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install coordinator deployment dependencies
        run: python -m pip install -r requirements-generator.txt
      - name: Resolve project name
        id: project
        shell: bash
        run: |
          if [ -n "${{ inputs.project_name }}" ]; then
            echo "name=${{ inputs.project_name }}" >> "$GITHUB_OUTPUT"
          else
            python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path
          with Path('config/configure_project.toml').open('rb') as handle:
              value = tomllib.load(handle)['project']['project_name']
          print(f'name={value}')
          PY
          fi
      - name: Provision or upgrade managed coordinator
        env:
          COORDINATOR_ADMIN_TOKEN_JSON: ${{ secrets.COORDINATOR_ADMIN_TOKEN_JSON }}
        run: >-
          python coordinator/deployment/manage.py ensure
          --repo-root .
          --project-name "${{ steps.project.outputs.name }}"
