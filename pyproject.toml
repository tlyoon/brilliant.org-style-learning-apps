[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brilliant-content-generator"
version = "0.3.0"
description = "Generate validated learning-content drafts from leased Google Drive PDFs via Gemini Gem conversations."
requires-python = ">=3.12,<3.13"
dependencies = [
  "google-auth==2.56.3",
  "google-auth-oauthlib==1.4.0",
  "jsonschema==4.26.0",
  "requests==2.34.2",
  "selenium==4.47.0",
]

[project.scripts]
brilliant-content-generator = "app_generator.cli:main"

[tool.setuptools.packages.find]
include = ["app_generator*"]

[tool.setuptools.package-data]
app_generator = ["resources/*.txt", "resources/*.md"]
